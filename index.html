<style>
/* Вигляд Kason 2: кольори бренду (бірюза, охра — акцент), м'які форми.
   Заокруглення — шкала --r-*; ряди дрібних кнопок і позначки — «капсули», стовпчики кнопок — заокруглені прямокутники (Apple HIG).
   Глибина — три рівні тіні (--e1 картки, --e2 плаваючі панелі, --e3 шторка): одне джерело світла згори, тінь у відтінку фону, кілька шарів
   (у темній темі — чорна: темнішого за тло кольору в палітрі немає). Кольори — лише палітра брендбука; відтінки й градієнти — її змішування (color-mix).
   Опуклість — кнопки (світліший верх + блік); втиснення — поля вводу, доріжки, натиснута кнопка. Сяйво — лише головна дія, рекорд, сигнал таймера.
   Межі елементів не тримаються лише на тіні: колір, рамка й кільце фокуса лишаються (WCAG 1.4.11). Українською — Manrope.
   Одне джерело — брендбук Kason, розділ «Форми й глибина»: радіуси --r-* і тіні --e* мають ті самі назви й значення, що й на сайті та в кабінеті;
   змінювати лише разом із брендбуком (слово Alexа). Контраст пар — машинна перевірка в test_engine.js. */
@font-face{font-family:Manrope;font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#f4f6f5; --card:#ffffff; --card2:color-mix(in srgb,#e8f0ef 50%,#ffffff); --ink:#1e1e1e; --muted:#5c6160; --line:#d8dcdb; --soft:#e8f0ef;
  --accent:#14514f; --accent2:#0d3937; --accent-ink:#ffffff; --accent-soft:#e8f0ef; --accent-text:#14514f;
  --ochre:#c8a96a; --ochre-text:#8a6f30; --focus:#14514f;
  --ok:#14514f; --ok-soft:#e8f0ef; --bad:#8c2f27; --gold:#c8a96a;
  --w:#5c6160; --d:#14514f; --f:#1e1e1e; --bm-base:#d8dcdb; --bm-0:#e8f0ef;
  --hero:#e8f0ef; --hero2:color-mix(in srgb,#e8f0ef 90%,#14514f); --hero-ink:#1e1e1e; --hero-muted:#5c6160; --hero-btn:#14514f; --hero-btn-ink:#ffffff; --hero-chip:#ffffff;
  --inv:#1e1e1e; --inv-ink:#ffffff; --mark-tile:#14514f;
  /* форми */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --card-line:rgba(20,81,79,.08);
  /* межа поля вводу — 3:1 до тла (WCAG 1.4.11), як input у брендбуку; --line лишається декором */
  --input-line:#5c6160;
  /* кнопки: опуклі (світліший верх) */
  --btn-top:#ffffff; --btn-bot:#f4f6f5; --btn-line:#d8dcdb; --pri-top:color-mix(in srgb,#14514f 88%,#ffffff);
  /* глибина: тінь у відтінку фону (бірюза), одне світло згори */
  --e1:0 1px 1px rgba(13,57,55,.05),0 2px 6px rgba(13,57,55,.07);
  --e2:0 1px 2px rgba(13,57,55,.06),0 6px 14px rgba(13,57,55,.10),0 16px 32px rgba(13,57,55,.08);
  --e3:0 -2px 8px rgba(13,57,55,.06),0 -12px 32px rgba(13,57,55,.12);
  --hl:inset 0 1px 0 rgba(255,255,255,.9);
  --pri-hl:inset 0 1px 0 rgba(255,255,255,.18);
  --in:inset 0 1px 2px rgba(13,57,55,.12);
  --press:inset 0 2px 4px rgba(13,57,55,.16);
  --glow:0 0 0 1px rgba(20,81,79,.06),0 6px 18px rgba(20,81,79,.30);
  --gold-glow:0 0 0 3px rgba(200,169,106,.28),0 0 18px rgba(200,169,106,.55);
  --glass:color-mix(in srgb,var(--card) 84%,transparent);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#08201f; --card:#0d3937; --card2:#0d3937; --ink:#eaefed; --muted:#9bb0ae; --line:#1c4b49; --soft:#08201f;
  --accent:#eaefed; --accent2:#ffffff; --accent-ink:#08201f; --accent-soft:rgba(20,81,79,.62); --accent-text:#eaefed;
  --ochre:#c8a96a; --ochre-text:#c8a96a; --focus:#c8a96a;
  --ok:#eaefed; --ok-soft:rgba(20,81,79,.62); --bad:#e08573; --gold:#c8a96a;
  --w:#9bb0ae; --d:#eaefed; --f:#eaefed; --bm-base:#1c4b49; --bm-0:#0d3937;
  --hero:#0d3937; --hero2:color-mix(in srgb,#0d3937 75%,#1c4b49); --hero-ink:#eaefed; --hero-muted:#9bb0ae; --hero-btn:#eaefed; --hero-btn-ink:#08201f; --hero-chip:#08201f;
  --inv:#eaefed; --inv-ink:#08201f; --mark-tile:#0d3937;
  --card-line:rgba(234,239,237,.07);
  --input-line:#9bb0ae;
  --btn-top:color-mix(in srgb,#0d3937 60%,#1c4b49); --btn-bot:#0d3937; --btn-line:#1c4b49; --pri-top:#ffffff;
  /* у темній тіні темніші й ширші, а опуклість — тонкий блік згори */
  --e1:0 1px 2px rgba(0,0,0,.30),0 2px 8px rgba(0,0,0,.22);
  --e2:0 2px 4px rgba(0,0,0,.32),0 10px 24px rgba(0,0,0,.36);
  --e3:0 -4px 12px rgba(0,0,0,.30),0 -16px 40px rgba(0,0,0,.40);
  --hl:inset 0 1px 0 rgba(255,255,255,.06);
  --pri-hl:inset 0 1px 0 rgba(255,255,255,.6);
  --in:inset 0 1px 3px rgba(0,0,0,.40);
  --press:inset 0 2px 5px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(234,239,237,.08),0 6px 22px rgba(234,239,237,.18);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;overscroll-behavior-y:none}
#app{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(170px + env(safe-area-inset-bottom))}
#app.wv{padding-top:0}
h1{font-size:1.75rem;font-weight:700;line-height:1.15;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1.1rem;font-weight:700;margin:22px 0 8px;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700;margin:0}
p{margin:6px 0}
b,strong{font-weight:700}
.muted{color:var(--muted)} .small{font-size:.84rem} .tiny{font-size:.74rem}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* знак застосунку: штанга на заокругленій плашці, середина грифа — охра */
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.brand svg.mark{width:32px;height:32px;flex:0 0 auto;display:block;border-radius:var(--r-xs);box-shadow:var(--e1)}
.brand b{font-size:1.02rem;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-md);box-shadow:var(--e1),var(--hl);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sp>button,.sp>.btn{flex:0 0 auto} .sp>div{min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;border-radius:var(--r-pill);padding:3px 10px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent-text)} .chip.ok{background:var(--ok-soft);color:var(--accent-text)}
.chip.w,.chip.g,.chip.b,.chip.p{background:var(--soft);color:var(--ink)}
/* тонка риска охрою — тепер кільце навколо капсули */
.chip.w,.chip.g{box-shadow:inset 0 0 0 1.5px var(--ochre)} .chip.b{box-shadow:inset 0 0 0 1.5px var(--bad)} .chip.p{box-shadow:inset 0 0 0 1.5px var(--accent-text)}
span.chip.g{box-shadow:inset 0 0 0 1.5px var(--ochre),0 0 12px rgba(200,169,106,.45)}
.note{border-radius:var(--r-sm);padding:10px 12px 10px 13px;margin:8px 0;font-size:.9rem;background:var(--card2);border-left:3px solid var(--line)}
.note.w{border-left-color:var(--ochre)} .note.b{border-left-color:var(--bad)} .note.ok{border-left-color:var(--accent-text)}
/* кнопки: опуклі; натиснута — втиснута */
button,.btn{font:inherit;font-size:.95rem;font-weight:500;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--btn-line);background:var(--btn-bot);background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:var(--ink);padding:10px 14px;cursor:pointer;-webkit-user-select:none;user-select:none;box-shadow:var(--e1),var(--hl);transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease}
button:active,.btn:active{transform:translateY(1px) scale(.985);box-shadow:var(--press);background:var(--btn-bot)}
button:disabled{opacity:.55;transform:none}
button.pri{background:var(--accent);background:linear-gradient(180deg,var(--pri-top),var(--accent));border:1px solid var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:var(--e1),var(--pri-hl)}
button.pri:active{background:var(--accent2);border-color:var(--accent2);box-shadow:var(--press)}
/* сяйво — лише головна дія екрана */
button.pri.big,.hero button.pri{box-shadow:var(--glow),var(--pri-hl)}
button.ghost,.btn.ghost{background:transparent;border:1px solid var(--accent-text);color:var(--accent-text);font-weight:500;box-shadow:none}
button.ghost:active,.btn.ghost:active{background:var(--accent-soft);box-shadow:none}
button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);font-weight:500;box-shadow:none}
button.danger:active{box-shadow:none}
/* дрібні кнопки в ряд — капсули */
button.sm{min-height:44px;min-width:44px;padding:8px 14px;font-size:.86rem;border-radius:var(--r-pill)}
button.wide{width:100%} button.big{min-height:54px;font-size:1.05rem;border-radius:var(--r-md)}
/* поля вводу — втиснуті */
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--input-line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%;box-shadow:var(--in)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
/* перемикач-сегменти: втиснута доріжка, обраний сегмент — опуклий (радіус = 12 − 3 відступ) */
.seg{display:flex;background:var(--soft);border-radius:var(--r-sm);padding:3px;gap:3px;margin:8px 0;box-shadow:var(--in)}
.seg button{flex:1;min-height:42px;border:0;background:transparent;font-size:.85rem;border-radius:9px;padding:6px 4px;color:var(--muted);box-shadow:none}
.seg button:active{transform:none;box-shadow:none;background:transparent}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--e1),inset 0 0 0 1px var(--accent-text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-md);box-shadow:var(--e1),var(--hl);padding:12px}
.stat b{display:block;font-size:1.4rem;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums} .stat span{font-size:.74rem;color:var(--muted)}
.hero{background:var(--hero);background:linear-gradient(160deg,var(--hero),var(--hero2));color:var(--hero-ink);border:1px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--e2),var(--hl)}
.hero .muted{color:var(--hero-muted)} .hero .chip{background:var(--hero-chip);color:var(--hero-ink)}
.hero button.pri{background:var(--hero-btn);background:linear-gradient(180deg,var(--pri-top),var(--hero-btn));border-color:var(--hero-btn);color:var(--hero-btn-ink)}
.list{margin:0;padding:0;list-style:none} .list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)} .list li:last-child{border-bottom:0}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:.9rem}
/* навігація: плаваюча «скляна» панель, обрана вкладка — капсула */
nav#tabs{position:fixed;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;z-index:20;background:var(--card);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--card-line);border-radius:28px;box-shadow:var(--e2);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px}
nav#tabs button{border:0;background:transparent;min-height:54px;padding:5px 0 3px;font-size:.7rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:none;border-radius:22px}
nav#tabs button:active{transform:scale(.96);box-shadow:none;background:transparent}
nav#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:var(--accent-text);font-weight:700;background:var(--accent-soft)}
/* тренування */
.wbar{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:6px;border-bottom:1px solid var(--card-line)}
.wbar .t{text-align:center;line-height:1.15;min-width:0;overflow:hidden} .wbar .t b{display:block;font-size:.95rem} .wbar .t span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wbar button{min-height:44px;padding:6px 12px} .wbar button.ghost{border-color:transparent}
.prog{height:4px;background:var(--soft);border-radius:var(--r-pill);margin:0 -4px 10px;overflow:hidden} .prog i{display:block;height:100%;background:var(--ochre);border-radius:var(--r-pill);transition:width .3s}
.exc{background:var(--card);border:1px solid var(--card-line);border-radius:var(--r-md);box-shadow:var(--e1),var(--hl);padding:12px 12px 8px;margin:12px 0}
.exc.ss{box-shadow:var(--e1),inset 0 0 0 1.5px color-mix(in srgb,var(--accent-text) 45%,transparent)}
.exc.skip{opacity:.5}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exh .mus{font-size:.74rem;color:var(--muted);margin-top:2px}
.ssb{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;border-radius:var(--r-pill);padding:1px 8px;margin-right:6px;vertical-align:2px;letter-spacing:.06em}
.dots{min-height:44px;min-width:44px;padding:0;font-size:1.2rem;border:0;background:var(--soft);border-radius:50%;line-height:1;box-shadow:none}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 2px}
.tb{margin-top:8px}
.tr{display:grid;grid-template-columns:40px minmax(0,1.1fr) minmax(0,1fr) minmax(0,.85fr) 46px;gap:6px;align-items:center;margin:5px 0;border-radius:var(--r-sm);padding:2px}
.tr.h{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0} .tr.h span{text-align:center}
.tr .st{min-height:44px;padding:0;border-radius:10px;font-weight:700;font-size:.9rem;background:var(--soft);border:0;box-shadow:none}
.tr .st.W{color:var(--w)} .tr .st.D{color:var(--d)} .tr .st.F{color:var(--f)}
.tr .pv{font-size:.8rem;color:var(--muted);text-align:center;min-height:44px;padding:2px;border:0;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:none}
.tr .cl{min-height:44px;padding:4px;border-radius:10px;background:var(--soft);border:1px solid transparent;font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums;line-height:1.1;box-shadow:var(--in)}
.tr .cl small{display:block;font-size:.7rem;font-weight:500;color:var(--muted)}
.tr .cl.na{background:transparent;color:var(--muted);font-weight:400;box-shadow:none}
.tr .ck{min-height:44px;padding:0;border-radius:10px;font-size:1.2rem;background:var(--soft);border:0;color:var(--muted);box-shadow:none}
.tr.dn{background:var(--ok-soft)} .tr.dn .cl,.tr.dn .st{background:transparent;box-shadow:none} .tr.dn .ck{background:var(--ok);color:var(--accent-ink);box-shadow:var(--e1)}
/* рекорд — золоте сяйво */
.tr.pr .ck{background:var(--gold);color:#1e1e1e;box-shadow:var(--gold-glow)}
.prb{grid-column:1/-1;font-size:.76rem;font-weight:700;color:var(--ink);padding:0 6px 4px}
.exf{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.plt{font-size:.78rem;color:var(--muted)}
.disc{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.disc i{display:inline-block;width:7px;border-radius:2px;background:var(--ink)} .disc i.d5{height:22px} .disc i.d25{height:17px;background:var(--ochre)} .disc i.d125{height:12px;background:var(--muted)} .disc b{display:inline-block;width:20px;height:5px;background:var(--muted);border-radius:2px}
/* шторка */
#sheetBg{position:fixed;inset:0;background:rgba(8,32,31,.45);z-index:40;display:none;opacity:0;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:1px solid var(--card-line);border-radius:24px 24px 0 0;box-shadow:var(--e3);padding:10px 16px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.4,0,.1,1);max-height:88vh;overflow:auto;max-width:640px;margin:0 auto}
body.sheet #sheetBg{display:block;opacity:1} body.sheet #sheet{transform:none}
.grab{width:38px;height:5px;border-radius:var(--r-pill);background:var(--line);margin:0 auto 10px}
.kv{font-size:2.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:4px 0}
.kv small{font-size:1rem;color:var(--muted);font-weight:500}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keys button{min-height:52px;font-size:1.25rem;font-weight:500;border-radius:var(--r-sm)}
